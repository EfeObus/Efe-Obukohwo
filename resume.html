<!DOCTYPE html>
<html lang="en">
<head>

    <title>Efe Obukohwo - Resume</title>
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <style>
        .download-buttons {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }
        
        .download-btn {
            background: #000;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            font-family: 'Times New Roman', serif;
            font-weight: bold;
            font-size: 12px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }
        
        .pdf-btn:hover {
            background: #c0392b;
        }
        
        .docx-btn:hover {
            background: #2980b9;
        }
        
        .print-btn:hover {
            background: #333;
        }
        
        @media print {
            .download-buttons {
                display: none;
            }
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Times New Roman', serif;
            line-height: 1.6;
            color: #000;
            background: #fff;
            font-size: 12px;
        }
        
        .resume-container {
            max-width: 8.5in;
            margin: 0 auto;
            padding: 0.5in;
            background: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        
        .header {
            text-align: center;
            border-bottom: 3px solid #000;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }
        
        .name {
            font-size: 28px;
            font-weight: bold;
            color: #000;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .title {
            font-size: 16px;
            color: #000;
            margin-bottom: 15px;
            font-weight: 500;
        }
        
        .contact-info {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            font-size: 11px;
        }
        
        .contact-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .section {
            margin-bottom: 20px;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: bold;
            color: #000;
            border-bottom: 2px solid #000;
            padding-bottom: 5px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .professional-summary {
            text-align: justify;
            line-height: 1.7;
            font-size: 11px;
        }
        
        .experience-item, .education-item, .project-item {
            margin-bottom: 15px;
            page-break-inside: avoid;
        }
        
        .job-header, .edu-header, .project-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
            width: 100%;
        }
        
        .job-title, .degree, .project-title {
            font-weight: bold;
            color: #000;
            font-size: 13px;
            flex: 1;
        }
        
        .company, .institution {
            font-weight: 600;
            color: #000;
            font-size: 12px;
            margin-bottom: 3px;
        }
        
        .date {
            font-style: italic;
            color: #000;
            font-size: 10px;
            white-space: nowrap;
            text-align: right;
            flex-shrink: 0;
            margin-left: auto;
        }
        
        .job-description ul, .project-description ul {
            list-style: none;
            padding-left: 0;
        }
        
        .job-description li, .project-description li {
            margin-bottom: 6px;
            padding-left: 15px;
            position: relative;
            font-size: 10px;
            line-height: 1.5;
            text-align: justify;
        }
        
        .job-description li:before, .project-description li:before {
            content: "•";
            color: #000;
            font-weight: bold;
            position: absolute;
            left: 0;
        }
        
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }
        
        .skill-category {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 5px;
            border-left: 4px solid #000;
        }
        
        .skill-category h4 {
            color: #000;
            margin-bottom: 8px;
            font-size: 11px;
            font-weight: bold;
        }
        
        .skill-list {
            font-size: 10px;
            line-height: 1.4;
        }
        
        .certifications-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }
        
        .cert-item {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            border-left: 3px solid #000;
        }
        
        .cert-title {
            font-weight: bold;
            color: #000;
            font-size: 10px;
            margin-bottom: 3px;
        }
        
        .cert-issuer {
            color: #000;
            font-size: 9px;
            margin-bottom: 2px;
        }
        
        .cert-date {
            color: #000;
            font-size: 9px;
            font-style: italic;
        }
        
        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }
        
        .gpa {
            color: #000;
            font-weight: bold;
        }
        
        .project-links {
            display: flex;
            gap: 15px;
            margin-top: 6px;
            margin-bottom: 4px;
        }
        
        .project-link {
            color: #1a73e8;
            text-decoration: none;
            font-size: 9px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        
        .project-link:hover {
            text-decoration: underline;
        }
        
        .project-link i {
            font-size: 10px;
        }
        
        .tech-stack {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 8px;
        }
        
        .tech-tag {
            background: #e3f2fd;
            color: #000;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 8px;
            font-weight: 500;
        }
        
        .achievements-list {
            list-style: none;
            padding-left: 0;
        }
        
        .achievements-list li {
            margin-bottom: 6px;
            padding-left: 15px;
            position: relative;
            font-size: 10px;
            line-height: 1.6;
        }
        
        .achievements-list li:before {
            content: "•";
            color: #000;
            font-weight: bold;
            position: absolute;
            left: 0;
        }
        
        @media print {
            body {
                font-size: 9px;
                line-height: 1.35;
            }

            .resume-container {
                box-shadow: none;
                max-width: none;
                padding: 0;
            }

            .header {
                padding-bottom: 8px;
                margin-bottom: 10px;
            }

            .name {
                font-size: 20px;
                margin-bottom: 4px;
            }

            .title {
                font-size: 12px;
                margin-bottom: 6px;
            }

            .contact-info {
                font-size: 8px;
                gap: 10px;
            }

            .section {
                margin-bottom: 8px;
            }

            .section-title {
                font-size: 11px;
                margin-bottom: 6px;
                padding-bottom: 3px;
            }

            .professional-summary {
                font-size: 8.5px;
                line-height: 1.4;
            }

            .experience-item, .education-item, .project-item {
                margin-bottom: 6px;
            }

            .job-header, .edu-header, .project-header {
                margin-bottom: 3px;
            }

            .job-title, .degree, .project-title {
                font-size: 9.5px;
            }

            .company, .institution {
                font-size: 8.5px;
                margin-bottom: 1px;
            }

            .date {
                font-size: 7.5px;
            }

            .job-description li, .project-description li {
                font-size: 8px;
                margin-bottom: 2px;
                line-height: 1.3;
                padding-left: 10px;
            }

            .skills-grid {
                gap: 8px;
            }

            .skill-category {
                padding: 6px;
            }

            .skill-category h4 {
                font-size: 8.5px;
                margin-bottom: 3px;
            }

            .skill-list {
                font-size: 7.5px;
                line-height: 1.25;
            }

            .certifications-grid {
                gap: 6px;
            }

            .cert-item {
                padding: 5px;
            }

            .cert-title {
                font-size: 7.5px;
            }

            .cert-issuer, .cert-date {
                font-size: 6.5px;
            }

            .achievements-list li {
                font-size: 8px;
                margin-bottom: 2px;
            }

            .tech-tag {
                font-size: 6.5px;
                padding: 1px 4px;
            }

            .project-link {
                font-size: 6.5px;
            }

            .project-links {
                margin-top: 3px;
                margin-bottom: 2px;
            }

            .page-break {
                page-break-before: always;
            }

            @page {
                margin: 0.35in;
                size: letter;
            }
        }
    </style>
</head>
<body>

    <!-- Load portfolio data first -->
    <script src="portfolio-data.js"></script>
