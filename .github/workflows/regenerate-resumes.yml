name: Regenerate Resume Documents

# Runs on macos-latest because PDF generation shells out to macOS's
# built-in `textutil` (DOCX -> HTML) before handing off to Puppeteer.
# Only watches the files that actually affect generated output, so the
# auto-commit this workflow makes (touching only documents/** and
# portfolio-data.json) never retriggers itself.
on:
  push:
    branches: [main]
    paths:
      - "portfolio-data.js"
      - "generate-resume-docx.js"
      - "generate-resume-pdf.js"
      - "generate-data-json.js"
      - "package.json"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Regenerate resume DOCX/PDF documents
        run: npm run generate-resume

      - name: Commit regenerated documents if changed
        run: |
          if git diff --quiet -- documents/ portfolio-data.json; then
            echo "No changes to generated documents."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add documents/ portfolio-data.json
          git commit -m "chore: auto-regenerate resume documents"
          git push
